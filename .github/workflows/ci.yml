name: CI

# The full test gate from docs/FIX-PLAN.md section 4.6, on every push and pull request.
# (Before Phase 0 the backend and frontend jobs only ran on pull requests.)
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit, integration, security, coverage)
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache the MongoDB test binary
        uses: actions/cache@v4
        with:
          # mongodb-memory-server downloads ~600 MB on a cold run. MONGOMS_DOWNLOAD_DIR
          # (set at job level) keeps it out of node_modules, which npm ci wipes.
          path: .mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-7.0

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Coverage and thresholds
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, test, coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Coverage and thresholds
        run: npm run test:coverage

      - name: Build and generate SEO assets
        run: npm run build

      - name: Upload production output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Cache the MongoDB test binary
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-7.0

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Run the end-to-end suite
        working-directory: e2e
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  audit:
    name: Dependency audit (high and above)
    runs-on: ubuntu-latest
    # Allowed to fail until Phase 3 updates mongoose, multer, zod, body-parser and vite.
    # Phase 3 removes this line and makes the job required.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend production dependencies
        # Run even when the backend audit fails, so both results are always reported.
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

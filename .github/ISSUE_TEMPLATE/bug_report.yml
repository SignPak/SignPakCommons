name: Bug report
description: Report a bug or unexpected behavior in the project
title: "Bug Report"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the details below so we can investigate quickly.

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One-line description of the issue
      placeholder: e.g. Login form fails on empty email
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that cause the issue
      placeholder: |
        1. Open the app
        2. Go to login
        3. Submit the form
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, app route, or other relevant details
      placeholder: |
        - OS:
        - Browser:
        - Node version:
        - App route:
        - Build or branch:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Add console output, screenshots, or stack traces if available
      placeholder: Paste logs or drag screenshots here
    validations:
      required: false

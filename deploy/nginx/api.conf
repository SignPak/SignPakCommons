# Nginx site for the SignPak Commons API at api.commons.signpak.tech (FIX-PLAN Phase 1, D1/D2).
# (Deliberately not api.signpak.tech: that name is kept for the future SignPAK app backend.)
#
# Install:  sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/signpakcommons-api.conf
#           sudo ln -s /etc/nginx/sites-available/signpakcommons-api.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Full walkthrough, including getting the certificate first: deploy/README.md.
#
# Node listens on 127.0.0.1:5000 only (HOST, production default) behind this file, so nobody can
# bypass Nginx and forge X-Forwarded-For. PM2: deploy/ecosystem.config.cjs. Only ports 22, 80
# and 443 are open on the firewall.

# HTTP: Let's Encrypt challenges, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.commons.signpak.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the newer `http2 on;`: Ubuntu 22.04/24.04 ship Nginx 1.18/1.24,
    # which predate `http2 on` (1.25.1+). Newer Nginx still accepts this form, with a notice.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.commons.signpak.tech;

    # Issued by certbot (deploy/README.md, step 7). Renewal reloads Nginx automatically.
    ssl_certificate     /etc/letsencrypt/live/api.commons.signpak.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.commons.signpak.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers must only ever reach the API over HTTPS. (Kept short of "preload": that is a
    # one-way commitment for the whole domain, to be decided by the team.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Recordings are up to 100 MB (MAX_RECORDING_UPLOAD_MB). The extra 10 MB covers multipart
    # overhead and the form fields; the API enforces the real limit and answers 413 itself.
    client_max_body_size 110m;

    # Stream uploads straight to Node instead of spooling 100 MB to disk first; Node writes
    # them to its own temp folder and checks their size and type.
    proxy_request_buffering off;

    # A large upload over a slow connection can take minutes.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;

    # Nginx never caches API responses: no proxy_cache is configured, and these two lines keep it
    # that way even if one is added globally. Browser caching is left to the API, which sets
    # Cache-Control per response (session data uncached, posters for 5 minutes).
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # The API trusts exactly one proxy hop (TRUST_PROXY=true): this one. Host and
        # X-Forwarded-Proto are overwritten, not appended, so a client cannot inject its own.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
